params:
  title: "Stuart's Profile"
  description: "Yu-Yuan (Stuart) Yang, PhD student in AI for drug discovery at Queen Mary University of London. Research, projects, publications and blog."
  # staticPath: ""  # The path to serve the static files from
  favicon: "/icons/logo.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"
  
  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # color:
  #   textColor:
  #   secondaryTextColor:
  #   backgroundColor:
  #   secondaryBackgroundColor:
  #   primaryColor:
  #   secondaryColor:

  #   darkmode:
  #     textColor:
  #     secondaryTextColor:
  #     backgroundColor:
  #     secondaryBackgroundColor:
  #     primaryColor:
  #     secondaryColor:

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Stuart's Profile" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Yu-Yuan (Stuart) Yang."
    subtitle: "PhD student in AI for drug discovery"
    content: "I work on machine learning for protein structure and molecular simulation. My background covers chemical engineering, bioinformatics, molecular modelling and computational biology."
    image: /images/me.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume/CV"
      url: "files/CV_stuart_v11.pdf"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/yuyuan871111
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/yuyuan871111/
        - icon: fab fa-researchgate
          url: https://www.researchgate.net/profile/Yu-Yuan-Yang
      customIcons:
        - icon: /icons/google-scholar.png
          url: https://scholar.google.com/citations?user=_UlrhSsAAAAJ&hl=en

  # About
  about:
    enable: true
    title: "About Me"
    # image: /images/me.jpg
    content: |-
      I'm a PhD student at Queen Mary University of London. I build deep learning tools that pick out the protein conformations from molecular dynamics simulations that are most likely to bind a ligand.

      Before that, I worked on Parkinson's video assessment, SARS-CoV-2 variants, cheminformatics and quantum computing at National Taiwan University.
    skills:
      enable: true
      title: "Tools I use most:"
      items:
        - "PyTorch, Scikit-learn"
        - "GROMACS"
        - "RDKit, MDAnalysis"
        - "PyMOL, VMD"
        - "R, R-Shiny, ggplot2"
        - "Ruby on Rails"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "PhD student / Demonstrator"
        company: "QMUL"
        companyUrl: "https://www.qmul.ac.uk/deri/ukri-aidd-doctoral-training-programme/people-/"
        date: "Sep 2023 - present"
        # featuredLink:
        #   enable: true
        #   name: "View the project"
        #   url: "https://example.com"
        content: |
          UKRI-funded PhD in AI for drug discovery (AIDD), London, UK.
          - Research: deep learning to find binding-relevant conformations in MD trajectories [[project](/tags/dlprobseg)].
          - Demonstrator (2024 spring): CHE209 (Python), BIO213 (planarian regeneration), SEF032 (β-galactosidase enzymology; DNA extraction from kiwi fruit).
        featuredLink:
          enable: true
          name: "SBBS Profile page"
          url: "https://www.qmul.ac.uk/sbbs/staff/yuyuanyang.html"

      - job: "Research student/Teaching assistant"
        company: "NTU"
        companyUrl: "https://www.bebi.ntu.edu.tw/"
        date: "Sep 2019 - Apr 2023"
        content: |
          Taipei, Taiwan.
          - Undergraduate research (Sep 2019 - Jun 2021): whey protein fibrils for emulsion stability [[project](/tags/wpifemusl)].
          - Master's research (Jun 2021 - Apr 2023): structural biology [[project](/tags/covidvari)], health informatics [[project](/tags/fastevalp)], cheminformatics [[project](/tags/sasdbqsar)] and quantum computing [[project](/tags/quantcadd)].
          - Teaching assistant: Calculus (2021 autumn, 2022 spring).

      - job: "Earlier experience"
        company: "see LinkedIn"
        date: "before 2021"
        companyUrl: "https://www.linkedin.com/in/yuyuan871111/"

