  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: "GSoC 2025: implicit H-bonds in ProLIF"
        badges:
          - "ProLIF"
          - "MDAnalysis"
          - "RDKit"
        content: |-
          Detect hydrogen bonds from heavy atoms only, so ProLIF users don't have to add hydrogens first. Includes a helper that fixes residue names and bond orders.
        image: /images/blog_pics/gsoc.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/gsocmdapl
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/GSoC2025_Hbond_PM
      
      - title: Deep learning for binding site segmentation
        badges:
          - "PyTorch"
          - "Molecular dynamics"
          - "Segmentation"
        content: |-
          A model that scans a protein's binding site and finds the conformations from MD simulations that look most ready to bind a ligand. My PhD project.
        image: /images/blog_pics/protein_ensemble.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/dlprobseg
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/ProBiSEnSe_pymol_plugin
      - title: FastEval Parkinsonism
        badges:
          - "PyTorch"
          - "Computer vision"
          - "Ruby on Rails"
        content: |-
          A web tool that rates Parkinsonian finger-tapping from a home video. Published in npj Digital Medicine (2024).
        image: /images/blog_pics/fastevalp.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/fastevalp
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/fast_eval_Parkinsonism
        featured:
          name: "Web services"
          link: "https://fastevalp.cmdm.tw/"
      
      - title: Whey Protein Fibril Microcapsules
        badges:
          - "Spectroscopy"
          - "Emulsions"
        content: |-
          Bilayer microcapsules of whey protein fibrils and polysaccharides that keep β-carotene stable in acidic conditions.
        image: /images/blog_pics/whey_protein_scoop.jpg
        links: 
        - icon: fa-solid fa-blog
          url: /tags/wpifemusl
      
      - title: SARS-CoV-2 omicron variants
        content: |-
          MD simulations of the spike–ACE2 interface: omicron variants form more compact complexes with more hydrogen bonds than earlier variants.
        image: /images/blog_pics/cute_sarscov2.png
