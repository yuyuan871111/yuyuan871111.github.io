  # projects & publications
  projects:
    enable: true
    title: "Projects & Publications"
    items:
      - title: "Deep learning for binding site segmentation"
        projectTag: "DLPROBSEG"
        badges:
          - "PyTorch"
          - "Molecular dynamics"
          - "Segmentation"
        content: |-
          A computer vision-based deep learning model that scans putative protein binding sites in molecular dynamics (MD) ensembles to identify conformations compatible with fragment and ligand binding. Stuart's PhD research at QMUL AIDD.
        image: /images/blog_pics/protein_ensemble.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/dlprobseg
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/ProBiSEnSe_pymol_plugin

      - title: "FastEval Parkinsonism"
        projectTag: "FASTEVALP"
        badges:
          - "PyTorch"
          - "Computer vision"
          - "Ruby on Rails"
        content: |-
          An instant deep learning-assisted online evaluation system for Parkinsonian motor symptoms from home finger-tapping hand videos. Published in npj Digital Medicine (2024).
        image: /images/blog_pics/fastevalp.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/fastevalp
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/fast_eval_Parkinsonism
        featured:
          name: "Live Web Service"
          link: "https://fastevalp.cmdm.tw/"

      - title: "GSoC 2025: implicit H-bonds in ProLIF"
        projectTag: "GSOCMDAPL"
        badges:
          - "ProLIF"
          - "MDAnalysis"
          - "RDKit"
        content: |-
          Detect hydrogen bonds from heavy atoms only, so ProLIF users don't have to add hydrogens first. Includes a helper that fixes residue names and bond orders.
        image: /images/blog_pics/gsoc.png
        links: 
        - icon: fa-solid fa-blog
          url: /tags/gsocmdapl
        - icon: fab fa-github
          url: https://github.com/yuyuan871111/GSoC2025_Hbond_PM

      - title: "Whey Protein Fibril Microcapsules"
        projectTag: "WPIFEMUSL"
        badges:
          - "Spectroscopy"
          - "Emulsions"
          - "Biomaterials"
        content: |-
          Bilayer microcapsules of whey protein isolate fibrils (WPFs) and pectin engineered to protect acid-sensitive lipophilic nutrients like β-carotene and preserve antioxidant bioavailability. Published in JTICE (2024).
        image: /images/blog_pics/whey_protein_study.jpg
        links: 
        - icon: fa-solid fa-blog
          url: /tags/wpifemusl

      - title: "SARS-CoV-2 omicron variants"
        projectTag: "COVIDVARI"
        badges:
          - "GROMACS"
          - "Protein-Protein Interaction"
        content: |-
          MD simulations of the spike–ACE2 interface: omicron variants form more compact complexes with more hydrogen bonds than earlier variants. Published in Briefings in Functional Genomics (2023).
        image: /images/blog_pics/sarscov2_study.jpeg
        links:
          - icon: fa fa-blog
            url: /tags/covidvari

